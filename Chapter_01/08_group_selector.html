    <style>
        h1,h2,h3{
            color: blueviolet;
        }
        h4{
            color: black;
        }

</head>
<body>
    <h1>heading </h1>
    <h2>heading 2 </h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
</body>
