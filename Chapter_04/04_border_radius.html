<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin property</title>\
    <style>
        *{
            margin: 0; padding: 0;
        }
        .box{
            padding: 40px;
            height: 60px; width: 60px;
            margin:20px ;
            padding: 40px;
            margin: 20px ;
        }
        #first{
            color: red;
            border: 2px solid black;
            border-radius: 5px 5px 5px 5px ;
            background-color: blue;
        }
        #second{
            color: red;
            border: 3px dashed gold;
            border-radius: 10px 30px 40px 10px ;
            background-color: rgb(4, 4, 61);
        }
    </style>
</head>
<body>
    <div id="first" class="box">first</div>
    <div id="second" class="box">second</div>
</body>
</html>
