<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin property</title>\
    <style>
        *{
            margin: 0; padding: 0;
        }
        .box{
            height: 60px; width: 60px;
        }
        #first{
            color: red;
            background-color: blue;
            padding: 40px;
            margin: 15px 10px 5px 20px ;
        }
        #second{
            color: red;
            background-color: rgb(4, 4, 61);
            padding: 40px;
            margin: 15px 10px 30px 20px ;
        }
    </style>
</head>
<body>
    <div id="first" class="box">first</div>
    <div id="second" class="box">second</div>
</body>
</html>
