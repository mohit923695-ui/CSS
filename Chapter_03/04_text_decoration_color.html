<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration Property</title>
    <style>
        #box1{height:70px;width:70px;
            background-color: blue; text-align: left;
            text-decoration: underline;
             text-decoration-style:wavy ;
            text-decoration-color: black;
        }
        #box2{height:70px;width:70px;
            background-color: firebrick; text-align: right;
            text-decoration: overline;
            text-decoration-style: double;
             text-decoration-color: black;
        }
        #box3{height:70px;width:70px;
            background-color:aquamarine; text-align: center;
            text-decoration: line-through;
            text-decoration-style: solid;
             text-decoration-color:gold;
        }

    </style>
</head>
<body>
    <div id="box1" class="box">Box 1</div><hr>
    <div id="box2" class="box">Box 2</div><hr>
    <div id="box3" class="box">Box 3</div><hr>
    <a href="#">link 1</a> <br><hr>
    <a href="#" style="text-decoration: none;">link 2 </a>
</body>
</html>
