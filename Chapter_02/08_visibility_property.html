<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility property</title>
    <style>
        .box{
            height: 50px; width: 50px;
        }
        #box1{
            color: black; background-color: aqua;
            visibility: hidden;
        }
        #box2{
            color: black; background-color: brown;

        }
    </style>
</head>
<body>
    <div id="box1" class="box">box 1</div> <br><hr>
    <div id="box2" class="box">box 2</div>
</body>
</html>
