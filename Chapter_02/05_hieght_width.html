<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width property</title>
    <style>
        .box{ height: 40px; width: 40px;}
        #box1{
            color: black; background-color: rgb(139, 38, 38);
        }
        #box2{
            color: blue;background-color: rgb(195, 171, 41);
        }
        #box3{
            color: blueviolet; background-color: rgb(123, 112, 134);
        }
    </style>
</head>
<body>
    <div id="box1" class = "box">Box 1</div> <br> <hr>
    <div id="box2" class = "box">Box 2</div> <br> <hr>
    <div id="box3" class = "box">Box 3</div>
</body>
</html>
