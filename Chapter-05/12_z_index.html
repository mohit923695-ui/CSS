<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position property</title>
    <style>
        *{
            margin: 0; padding: 0;
        }
        .box{
            color: black; background-color: dodgerblue;
            margin: 10px;
            height: 60px; width: 60px;
            text-align: center;
            border:2px solid black;
        
        }
        #box1{
            position: absolute;
            right: 360;
            bottom: 650px;
            background-color: blueviolet;
        }
        #box2{
            position: absolute;
        }
       
    </style>
</head>
<body>
    <div id="box1" class="box">absolute </div>
    <div id="box2" class="box">absolute </div>
  
</body>
</html>
